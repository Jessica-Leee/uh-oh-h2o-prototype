<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0369A1" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- outer mark -->
  <circle cx="60" cy="60" r="54" fill="url(#bgGrad)" />
  <circle cx="60" cy="60" r="54" fill="none" stroke="#bae6fd" stroke-width="2" />

  <!-- wave accent -->
  <path d="M20 78c8-5 16-5 24 0s16 5 24 0 16-5 24 0 16 5 24 0" fill="none" stroke="#7dd3fc" stroke-width="3.2" stroke-linecap="round" opacity="0.8" />

  <!-- droplet -->
  <path d="M60 20c0 0-21 24-21 42 0 13.1 9.9 23 21 23s21-9.9 21-23C81 44 60 20 60 20z" fill="url(#dropGrad)" filter="url(#shadow)" />

  <!-- inner highlight -->
  <path d="M53 42c-4 5-7 11-7 18 0 4.5 1.2 8.5 3.4 11.6" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" />

  <!-- warning badge -->
  <circle cx="60" cy="67" r="12" fill="#fff" />
  <circle cx="60" cy="67" r="10" fill="url(#badgeGrad)" />
  <path d="M60 62v6" stroke="#fff" stroke-width="3.2" stroke-linecap="round" />
  <circle cx="60" cy="71.8" r="1.8" fill="#fff" />

  <!-- sparkle -->
  <path d="M88 30l2.1 4.5 4.9.8-3.5 3.5.9 4.8-4.4-2.4-4.4 2.4.9-4.8-3.5-3.5 4.9-.8z" fill="#facc15" opacity="0.9" />
</svg>
