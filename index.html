<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uh-Oh H2O — Northern Virginia Water Watch</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="phone-notch"></div>
      <div class="phone-screen" id="phone-screen">
        <header class="app-header" id="app-header">
          <button class="hdr-btn back-btn" id="backBtn" aria-label="Back">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="hdr-title" id="hdrTitle">Uh-Oh H2O</div>
          <button class="hdr-btn" id="alertBtn" aria-label="Alerts">
            <svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6z M10 19a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="hdr-badge">3</span>
          </button>
        </header>

        <main class="app-body" id="appBody"></main>

        <nav class="app-tabs" id="appTabs">
          <button class="tab" data-screen="home">
            <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V11z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>
            <span>Home</span>
          </button>
          <button class="tab" data-screen="map">
            <svg viewBox="0 0 24 24"><path d="M9 3 3 5v16l6-2 6 2 6-2V3l-6 2-6-2z M9 3v16 M15 5v16" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>
            <span>Map</span>
          </button>
          <button class="tab tab-center" data-screen="report">
            <div class="tab-center-icon">
              <svg viewBox="0 0 24 24"><path d="M12 5v14 M5 12h14" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
            </div>
            <span>Report</span>
          </button>
          <button class="tab" data-screen="forum">
            <svg viewBox="0 0 24 24"><path d="M4 5h16v11H7l-3 3V5z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>
            <span>Forum</span>
          </button>
          <button class="tab" data-screen="advocate">
            <svg viewBox="0 0 24 24"><path d="M4 10l10-6v16L4 14v-4z M14 8h4v8h-4 M18 12h2" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>
            <span>Advocate</span>
          </button>
        </nav>
      </div>
      <div class="phone-side phone-side-power"></div>
      <div class="phone-side phone-side-volume-up"></div>
      <div class="phone-side phone-side-volume-dn"></div>
    </div>
  </div>

  <!-- Modal root -->
  <div class="modal-root" id="modalRoot" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
